name: shellcheck

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' '*.bash' '*.dash' '*.ksh' '*.shlib' \
            | xargs -0 -r shellcheck --format=gcc --
