      xml:
        name: hours
      required:
        - current
        - planned
      properties:
        current:
          type: integer
          format: int32
          description: Hours already present in the timetable.
          minimum: 0
        proposed:
          type: integer
          format: int32
          description: Hours proposed by the mandatory curriculum, when a positive proposal exists.
          minimum: 1
        planned:
          type: integer
          format: int32
          description: Hours that the draft would apply to the timetable.
          minimum: 0
    DraftLoad:
      type: object
      description: Planned load for one class and subject.
      xml:
        name: load
      required:
        - schoolClass
        - subject
        - hours
        - decision
      properties:
        schoolClass:
          description: Class to which the entry applies.
          allOf:
            - $ref: "#/components/schemas/SchoolClass"
          xml:
            name: schoolClass
        subject:
          description: Subject to which the entry applies.
          allOf:
            - $ref: "#/components/schemas/Subject"
          xml:
            name: subject
        hours:
          description: Comparison of current and planned weekly hours.
          allOf:
            - $ref: "#/components/schemas/DraftHours"
          xml:
            name: hours
        decision:
          type: string
          description: Origin of the planned hours.
          enum:
            - none
            - plan
            - manual
    DraftAdditionalSubject:
      type: object
      description: Subject and its additional weekly hours for a grade.
      xml:
        name: subject
      required:
        - id
        - name
        - origin
        - hours
      properties:
        id:
          type: integer
          format: int64
          description: Subject identifier.
          minimum: 1
        name:
          type: string
          description: Subject name.
        origin:
          type: string
          description: Catalogue the subject belongs to.
          enum:
            - FEDERAL
            - SCHOOL
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 0
    DraftAdditionalClass:
      type: object
      description: Class and its total additional hours.
      xml:
        name: class
      required:
        - id
        - name
        - grade
        - litera
        - hours
      properties:
        id:
          type: integer
          format: int64
          description: School class identifier.
          minimum: 1
        name:
          type: string
          description: Display label formed from the grade and letter.
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        litera:
          type: string
          description: Class letter within the grade, such as А.
        hours:
          description: Current and planned additional hours for the class.
          allOf:
            - $ref: "#/components/schemas/DraftHours"
          xml:
            name: hours
    DraftAddition:
      type: object
      description: Additional hours and their allowances and class totals for a grade.
      xml:
        name: addition
      required:
        - grade
        - requirements
        - subjects
        - classes
      properties:
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        requirements:
          type: array
          description: Optional requirements for this grade.
          items:
            allOf:
              - $ref: "#/components/schemas/OptionalRequirement"
            xml:
              name: requirement
          xml:
            wrapped: true
        subjects:
          type: array
          description: Additional subject allocations.
          items:
            allOf:
              - $ref: "#/components/schemas/DraftAdditionalSubject"
            xml:
              name: subject
          xml:
            wrapped: true
        classes:
          type: array
          description: Totals for classes in this grade.
          items:
            allOf:
              - $ref: "#/components/schemas/DraftAdditionalClass"
            xml:
              name: class
          xml:
            wrapped: true
    LoadDraft:
      type: object
      description: Saved draft with current, proposed and planned weekly hours.
      xml:
        name: draft
      required:
        - curriculum
        - loads
        - additions
        - requirements
        - unavailable
      properties:
        curriculum:
          description: Federal curriculum used to calculate the draft.
          allOf:
            - $ref: "#/components/schemas/CurriculumV2"
          xml:
            name: curriculum
        loads:
          type: array
          description: Planned class and subject loads.
          items:
            allOf:
              - $ref: "#/components/schemas/DraftLoad"
            xml:
              name: load
          xml:
            wrapped: true
        additions:
          type: array
          description: Optional allocations and totals grouped by grade.
          items:
            allOf:
              - $ref: "#/components/schemas/DraftAddition"
            xml:
              name: addition
          xml:
            wrapped: true
        requirements:
          type: array
          description: Requirements of the selected curriculum.
          items:
            allOf:
              - $ref: "#/components/schemas/Requirement"
            xml:
              name: requirement
          xml:
            wrapped: true
        unavailable:
          type: array
          description: Mandatory requirements that cannot currently be applied.
          items:
            allOf:
              - $ref: "#/components/schemas/MandatoryRequirement"
            xml:
              name: requirement
          xml:
            wrapped: true
    LoadDraftXml:
      description: XML representation of a saved teaching load draft.
      allOf:
        - $ref: "#/components/schemas/LoadDraft"
      xml:
        name: draft
