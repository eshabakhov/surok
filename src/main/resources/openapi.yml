components:
  schemas:
    School:
      type: object
      description: School returned by the application.
      xml:
        name: school
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the school.
          minimum: 1
        name:
          type: string
          description: Display name of the school.
    SchoolInput:
      type: object
      description: Fields used to create or update a school.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank display name of the school.
          minLength: 1
    Building:
      type: object
      description: School building returned by the application.
      xml:
        name: building
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the school building.
          minimum: 1
        name:
          type: string
          description: Display name of the school building.
    BuildingInput:
      type: object
      description: Fields used to create or update a school building.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank display name of the school building.
          minLength: 1
    Cabinet:
      type: object
      description: Classroom returned by the application.
      xml:
        name: cabinet
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the classroom.
          minimum: 1
        name:
          type: string
          description: Display name of the classroom.
    CabinetInput:
      type: object
      description: Fields used to create or update a classroom.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank display name of the classroom.
          minLength: 1
    Teacher:
      type: object
      description: Teacher returned by the application.
      xml:
        name: teacher
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the teacher.
          minimum: 1
        name:
          type: string
          description: Display name of the teacher.
    TeacherInput:
      type: object
      description: Fields used to create or update a teacher.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank display name of the teacher.
          minLength: 1
    Schedule:
      type: object
      description: Timetable returned by the application.
      xml:
        name: schedule
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the timetable.
          minimum: 1
        name:
          type: string
          description: Display name of the timetable.
    ScheduleInput:
      type: object
      description: Fields used to create or update a timetable.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank display name of the timetable.
          minLength: 1
    SchoolClassInput:
      type: object
      description: Grade and letter of a school class.
      required:
        - grade
        - litera
      properties:
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        litera:
          type: string
          description: Class letter within the grade, such as А.
    SchoolClass:
      type: object
      description: School class and its display label.
      xml:
        name: school-class
      required:
        - id
        - name
        - grade
        - litera
      properties:
        id:
          type: integer
          format: int64
          description: School class identifier.
          minimum: 1
        name:
          type: string
          description: Display label formed from the grade and letter.
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        litera:
          type: string
          description: Class letter within the grade, such as А.
    SubjectInput:
      type: object
      description: Name of a federal or school subject.
      required:
        - name
      properties:
        name:
          type: string
          description: Non-blank subject name.
          minLength: 1
    Subject:
      type: object
      description: Subject from the federal catalogue or an individual school.
      xml:
        name: subject
      required:
        - id
        - name
        - origin
      properties:
        id:
          type: integer
          format: int64
          description: Subject identifier.
          minimum: 1
        name:
          type: string
          description: Subject name.
        origin:
          type: string
          description: Catalogue the subject belongs to.
          enum:
            - FEDERAL
            - SCHOOL
    CurriculumInput:
      type: object
      description: Fields accepted by the federal curriculum form.
      required:
        - title
        - level
        - week
        - version
        - year
      properties:
        title:
          type: string
          description: Title of the federal curriculum.
        level:
          type: string
          description: Education level covered by this curriculum.
          enum:
            - PRIMARY
            - BASIC
            - SECONDARY
        week:
          type: string
          description: Number of teaching days in a week.
          enum:
            - FIVE_DAYS
            - SIX_DAYS
        version:
          type: string
          description: Curriculum edition identifier.
        year:
          type: string
          description: Academic year in YYYY/YYYY form.
        description:
          type: string
          description: Optional explanatory text about the curriculum.
          nullable: true
    CurriculumV1:
      type: object
      description: Version 1 representation of a federal curriculum.
      xml:
        name: curriculum
      required:
        - id
        - title
        - level
        - week
        - version
        - year
      properties:
        id:
          type: integer
          format: int64
          description: Federal curriculum identifier.
          minimum: 1
        title:
          type: string
          description: Title of the federal curriculum.
        level:
          type: string
          description: Education level covered by this curriculum.
          enum:
            - PRIMARY
            - BASIC
            - SECONDARY
        week:
          type: string
          description: Number of teaching days in a week.
          enum:
            - FIVE_DAYS
            - SIX_DAYS
        version:
          type: string
          description: Curriculum edition identifier.
        year:
          type: string
          description: Academic year in YYYY/YYYY form.
    CurriculumV2:
      type: object
      description: Version 2 representation, including the curriculum description.
      xml:
        name: curriculum
      required:
        - id
        - title
        - level
        - week
        - version
        - year
        - description
      properties:
        id:
          type: integer
          format: int64
          description: Federal curriculum identifier.
          minimum: 1
        title:
          type: string
          description: Title of the federal curriculum.
        level:
          type: string
          description: Education level covered by this curriculum.
          enum:
            - PRIMARY
            - BASIC
            - SECONDARY
        week:
          type: string
          description: Number of teaching days in a week.
          enum:
            - FIVE_DAYS
            - SIX_DAYS
        version:
          type: string
          description: Curriculum edition identifier.
        year:
          type: string
          description: Academic year in YYYY/YYYY form.
        description:
          type: string
          description: Optional explanatory text about the curriculum.
          nullable: true
    MandatoryRequirement:
      type: object
      description: Weekly hours required for a particular federal subject and grade.
      xml:
        name: requirement
      required:
        - id
        - grade
        - subject
        - hours
        - partType
      properties:
        id:
          type: integer
          format: int64
          description: Requirement identifier.
          minimum: 1
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        subject:
          description: Federal subject for which these hours are required.
          allOf:
            - $ref: "#/components/schemas/Subject"
          xml:
            name: subject
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 1
        partType:
          type: string
          description: Compulsory hours for a specific subject.
          enum:
            - MANDATORY
    OptionalRequirement:
      type: object
      description: Allowance for additional weekly teaching hours in a grade.
      xml:
        name: requirement
      required:
        - id
        - grade
        - hours
        - partType
      properties:
        id:
          type: integer
          format: int64
          description: Allowance identifier.
          minimum: 1
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 0
        partType:
          type: string
          description: Grade-wide hours available for additional subjects.
          enum:
            - OPTIONAL
    Requirement:
      description: A mandatory subject requirement or an optional grade allowance.
      oneOf:
        - $ref: "#/components/schemas/MandatoryRequirement"
        - $ref: "#/components/schemas/OptionalRequirement"
      xml:
        name: requirement
    MandatoryRequirementInput:
      type: object
      description: Required fields for a compulsory subject requirement.
      required:
        - grade
        - subjectId
        - hours
        - partType
      properties:
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        subjectId:
          type: integer
          format: int64
          description: Identifier of the federal subject.
          minimum: 1
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 1
        partType:
          type: string
          description: Compulsory hours for a specific subject.
          enum:
            - MANDATORY
    OptionalRequirementInput:
      type: object
      description: Fields for the grade-wide optional hours allowance. Omit subjectId.
      required:
        - grade
        - hours
        - partType
      properties:
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 0
        partType:
          type: string
          description: Grade-wide hours available for additional subjects.
          enum:
            - OPTIONAL
    RequirementInput:
      description: A subject requirement or a grade-wide allowance. Updates retain the existing kind.
      oneOf:
        - $ref: "#/components/schemas/MandatoryRequirementInput"
        - $ref: "#/components/schemas/OptionalRequirementInput"
    RequirementSelectionForm:
      type: object
      description: Create a requirement by choosing a federal subject or the optional allowance.
      required:
        - grade
        - hours
        - selection
      properties:
        grade:
          type: integer
          format: int32
          description: School grade, from 1 through 11.
          minimum: 1
          maximum: 11
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 0
        selection:
          type: string
          description: Federal subject identifier as text, or OPTIONAL for a grade allowance.
          pattern: ^(OPTIONAL|[1-9][0-9]*)$
    RequirementCreateForm:
      description: Use either the page selector or the explicit requirement fields.
      anyOf:
        - $ref: "#/components/schemas/RequirementSelectionForm"
        - $ref: "#/components/schemas/RequirementInput"
    ClassLoad:
      type: object
      description: Current weekly teaching load of a class in a timetable.
      xml:
        name: load
      required:
        - id
        - schoolClass
        - subject
        - hours
      properties:
        id:
          type: integer
          format: int64
          description: Teaching load entry identifier.
          minimum: 1
        schoolClass:
          description: Class that receives the teaching load.
          allOf:
            - $ref: "#/components/schemas/SchoolClass"
          xml:
            name: schoolClass
        subject:
          description: School or federal subject assigned to the class.
          allOf:
            - $ref: "#/components/schemas/Subject"
          xml:
            name: subject
        hours:
          type: integer
          format: int32
          description: Number of weekly teaching hours.
          minimum: 0
    Page:
