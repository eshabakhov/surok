                          <grade>5</grade>
                          <requirements>
                            <requirement>
                              <id>73</id>
                              <grade>5</grade>
                              <hours>3</hours>
                              <partType>OPTIONAL</partType>
                            </requirement>
                          </requirements>
                          <subjects>
                            <subject>
                              <id>31</id>
                              <name>Музыка</name>
                              <origin>SCHOOL</origin>
                              <hours>2</hours>
                            </subject>
                          </subjects>
                          <classes>
