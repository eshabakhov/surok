      summary: View permissions by resource and role
      description: |
        Administrator-only matrix of registered application controllers and their authorization
        rules. Select the response media type in Swagger's response selector. Each access
        entry contains role, title and scope: all (no school restriction), school (own school
        only), or denied. Additional conditions are described in condition. Main resource
        routes are listed, excluding GET aliases for forms and fragments. Examples show an
        excerpt; the response includes all roles, including ANONYMOUS
      operationId: page_4
      responses:
        "200":
          description: Permission matrix grouped by resource.
          content:
            application/vnd.surok.permissions.v1+json:
              schema:
                $ref: "#/components/schemas/Permissions"
              examples:
                matrix:
                  summary: Permission matrix available to system administrators.
                  value:
                    operations:
                      - resource: Школы
                        action: Просмотр школы
                        path: /schools/{school}
                        method: GET
                        consumes: ""
                        condition: ""
                        access:
                          - role: DIRECTOR
                            title: Директор школы
                            scope: school
            application/vnd.surok.permissions.v1+xml:
              schema:
                $ref: "#/components/schemas/PermissionsXml"
              examples:
                matrix:
                  summary: XML representation of the permissions matrix.
                  value: |-
                    <permissions>
                      <operations>
                        <operation>
                          <resource>Школы</resource>
                          <action>Просмотр школы</action>
                          <path>/schools/{school}</path>
                          <method>GET</method>
                          <consumes></consumes>
                          <condition></condition>
                          <access>
                            <grant>
                              <role>DIRECTOR</role>
                              <title>Директор школы</title>
                              <scope>school</scope>
                            </grant>
                          </access>
                        </operation>
                      </operations>
                    </permissions>
            text/html:
              schema:
                $ref: "#/components/schemas/HtmlPage"
              examples:
                example:
                  $ref: "#/components/examples/HtmlPagePermissionsHtml"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"
