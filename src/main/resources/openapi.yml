          items:
            $ref: "#/components/schemas/DraftSubjectInput"
    LoadDraftInput:
      type: object
      description: Selected curriculum and additional hours. Include each grade at most once.
      required:
        - curriculum
        - additions
      properties:
        curriculum:
          description: Federal curriculum selected for the draft.
          allOf:
            - $ref: "#/components/schemas/CurriculumReference"
