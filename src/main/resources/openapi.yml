          type: array
          description: Additional hours by grade; use an empty array when there are none.
          items:
            $ref: "#/components/schemas/DraftGradeInput"
    DraftCurriculumInput:
      type: object
      description: >-
        Switch the federal curriculum used by an existing draft and reset additional hours when the plan
        changes.
      required:
        - curriculum
      properties:
        curriculum:
          description: Federal curriculum to use for the saved draft.
          allOf:
            - $ref: "#/components/schemas/CurriculumReference"
