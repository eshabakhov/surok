  /schools/{school}/schedules/{schedule}/loads/draft:
    get:
      tags:
        - Teaching load planning
      summary: Read the schedule's teaching load draft
      description: |
        Returns the saved draft. All hours are per week
        Identifiers in examples must be replaced with existing school, schedule,
        curriculum and subject identifiers
      operationId: read
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          example: 12
          description: School identifier.
        - name: schedule
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: Timetable identifier.
            minimum: 1
          example: 25
          description: Timetable identifier.
      responses:
        "200":
          description: Current state of the teaching load draft.
          content:
            application/vnd.surok.load-draft.v1+json:
              schema:
                $ref: "#/components/schemas/LoadDraft"
              examples:
                saved:
                  summary: Saved draft with current, proposed and planned weekly hours.
                  value:
                    curriculum:
                      id: 61
                      title: Основной учебный план
                      level: BASIC
                      week: FIVE_DAYS
                      version: "1"
                      year: 2026/2027
                      description: Основная школа
                    loads:
                      - schoolClass:
                          id: 41
                          name: 5А
                          grade: 5
                          litera: А
                        subject:
                          id: 29
                          name: Математика
                          origin: FEDERAL
                        hours:
                          current: 5
                          proposed: 3
                          planned: 3
                        decision: plan
                      - schoolClass:
                          id: 41
                          name: 5А
                          grade: 5
                          litera: А
                        subject:
                          id: 31
                          name: Музыка
                          origin: SCHOOL
                        hours:
                          current: 0
                          planned: 2
                        decision: manual
                    additions:
                      - grade: 5
                        requirements:
                          - id: 73
                            grade: 5
                            hours: 3
                            partType: OPTIONAL
                        subjects:
                          - id: 31
                            name: Музыка
                            origin: SCHOOL
                            hours: 2
                        classes:
                          - id: 41
                            name: 5А
                            grade: 5
                            litera: А
                            hours:
                              current: 0
                              planned: 2
                    requirements:
                      - id: 71
                        grade: 5
                        subject:
                          id: 29
                          name: Математика
                          origin: FEDERAL
                        hours: 3
                        partType: MANDATORY
                      - id: 73
                        grade: 5
                        hours: 3
                        partType: OPTIONAL
                    unavailable: []
            application/vnd.surok.load-draft.v1+xml:
              schema:
                $ref: "#/components/schemas/LoadDraftXml"
              examples:
                saved:
                  summary: XML representation of a saved teaching load draft.
                  value: |-
                    <draft>
                      <curriculum>
                        <id>61</id>
                        <title>Основной учебный план</title>
                        <level>BASIC</level>
                        <week>FIVE_DAYS</week>
                        <version>1</version>
                        <year>2026/2027</year>
                        <description>Основная школа</description>
                      </curriculum>
                      <loads>
                        <load>
                          <schoolClass>
                            <id>41</id>
                            <name>5А</name>
                            <grade>5</grade>
                            <litera>А</litera>
                          </schoolClass>
                          <subject>
                            <id>29</id>
                            <name>Математика</name>
                            <origin>FEDERAL</origin>
                          </subject>
                          <hours>
                            <current>5</current>
                            <proposed>3</proposed>
                            <planned>3</planned>
                          </hours>
                          <decision>plan</decision>
                        </load>
                        <load>
                          <schoolClass>
                            <id>41</id>
                            <name>5А</name>
                            <grade>5</grade>
                            <litera>А</litera>
                          </schoolClass>
                          <subject>
                            <id>31</id>
                            <name>Музыка</name>
                            <origin>SCHOOL</origin>
                          </subject>
                          <hours>
                            <current>0</current>
                            <planned>2</planned>
                          </hours>
                          <decision>manual</decision>
                        </load>
                      </loads>
                      <additions>
