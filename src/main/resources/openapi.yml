# Canonical API description; operations are filtered when this document is served.
openapi: 3.0.1
info:
  title: Surok API
  version: "@project.version@"
  description: Manage schools, federal curricula, and schedules.
servers:
  - url: /
security:
  - Basic auth: []
paths:
  /schools/{school}:
    get:
      tags:
        - Schools
      summary: Get school
      operationId: school
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          description: School identifier.
          example: 12
      responses:
        "200":
          description: The requested resource.
          content:
            application/vnd.surok.school-v1+json:
              schema:
                $ref: "#/components/schemas/School"
              examples:
                example:
                  $ref: "#/components/examples/SchoolJson"
            application/vnd.surok.school-v1+xml:
              schema:
                $ref: "#/components/schemas/School"
              examples:
                example:
                  $ref: "#/components/examples/SchoolXml"
            text/html:
              schema:
                $ref: "#/components/schemas/HtmlPage"
              examples:
                example:
                  $ref: "#/components/examples/HtmlPageSchoolDetailsHtml"
    put:
      tags:
        - Schools
      summary: Update school
      description: Update the school with JSON. The browser edit form uses this operation.
      operationId: revise
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          description: School identifier.
          example: 12
      responses:
        "200":
          description: The resource was updated.
          content:
            application/vnd.surok.school-v1+json:
              schema:
                $ref: "#/components/schemas/School"
              examples:
                example:
                  $ref: "#/components/examples/SchoolJson"
            application/vnd.surok.school-v1+xml:
              schema:
                $ref: "#/components/schemas/School"
              examples:
                example:
                  $ref: "#/components/examples/SchoolXml"
        "302":
          description: Browser requests are redirected to the resource page. No body.
          headers:
            Location:
              description: Relative URL of the resource or page to open.
              schema:
                type: string
              example: /schools/12
        "400":
          $ref: "#/components/responses/InvalidRequest"
      requestBody:
        description: Replacement fields for the existing resource.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
            examples:
              example:
                $ref: "#/components/examples/SchoolInputJson"
          application/vnd.surok.school-v1+json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
            examples:
              example:
                $ref: "#/components/examples/SchoolInputJson"
    delete:
      tags:
        - Schools
      summary: Remove school
      operationId: remove
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          description: School identifier.
          example: 12
      responses:
        "204":
          description: The resource was removed. This response has no body.
  /schools/{school}/users/{user}:
    put:
      tags:
        - School users
      summary: Add existing user to school
      operationId: add
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          description: School identifier.
          example: 12
        - name: user
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: User account identifier.
            minimum: 1
          description: User account identifier.
          example: 53
      responses:
        "200":
          description: The account already belongs to the school.
          headers:
            Location:
              description: Relative URL of the resource or page to open.
              schema:
                type: string
              example: /schools/12/users/53
          content:
            application/vnd.surok.school-user.v1+json:
              schema:
                $ref: "#/components/schemas/SchoolMember"
              examples:
                example:
                  $ref: "#/components/examples/SchoolMemberJson"
            application/vnd.surok.school-user.v1+xml:
              schema:
                $ref: "#/components/schemas/SchoolMember"
              examples:
                example:
                  $ref: "#/components/examples/SchoolMemberXml"
        "201":
          description: The account was added to the school.
          headers:
            Location:
              description: Relative URL of the resource or page to open.
              schema:
                type: string
              example: /schools/12/users/53
          content:
            application/vnd.surok.school-user.v1+json:
              schema:
                $ref: "#/components/schemas/SchoolMember"
              examples:
                example:
                  $ref: "#/components/examples/SchoolMemberJson"
            application/vnd.surok.school-user.v1+xml:
              schema:
                $ref: "#/components/schemas/SchoolMember"
              examples:
                example:
                  $ref: "#/components/examples/SchoolMemberXml"
    delete:
      tags:
        - School users
      summary: Remove user from school
      operationId: remove_1
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: School identifier.
            minimum: 1
          description: School identifier.
          example: 12
        - name: user
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: User account identifier.
            minimum: 1
          description: User account identifier.
          example: 53
      responses:
        "204":
          description: The resource was removed. This response has no body.
