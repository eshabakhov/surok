          type: string
          description: Short localized name of the error.
        message:
          type: string
          description: Reason the request could not be completed.
        timestamp:
          type: string
          description: UTC time at which the error response was generated.
          format: date-time
    PermissionGrant:
      type: object
      description: Access granted to one role for the operation.
      xml:
        name: grant
      required:
        - role
        - title
        - scope
      properties:
        role:
          type: string
          description: Role code, including ANONYMOUS for unauthenticated callers.
        title:
          type: string
          description: Localized display title of the role.
        scope:
          type: string
          description: "Access scope: unrestricted for this role, limited to a school membership, or denied."
          enum:
            - all
            - school
            - denied
    PermissionOperation:
      type: object
      description: One application route and its role-based access rules.
      xml:
        name: operation
      required:
        - resource
        - action
        - path
        - method
        - consumes
        - condition
        - access
      properties:
        resource:
          type: string
          description: Localized resource group.
        action:
          type: string
          description: Localized action name.
        path:
          type: string
          description: Route template with path parameters.
        method:
          type: string
          description: HTTP method.
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - TRACE
        consumes:
          type: string
          description: Comma-separated request media types; empty when the operation does not declare any.
        condition:
          type: string
          description: Additional access conditions; empty when none apply.
        access:
          type: array
          description: Access for each role.
          items:
            allOf:
              - $ref: "#/components/schemas/PermissionGrant"
            xml:
              name: grant
          xml:
            wrapped: true
    Permissions:
      type: object
